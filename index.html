<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAMD 2026 Fall Conference</title>
<link rel="stylesheet" href="site.css">
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Program.jsx"></script>
<script type="text/babel" src="Register.jsx"></script>
<script type="text/babel" src="Sponsors.jsx"></script>

<script type="text/babel">
const { useState } = React;

function App() {
  const [page, setPage] = useState('Overview');
  // scroll to top on nav
  React.useEffect(() => { window.scrollTo({ top: 0, behavior: 'instant' }); }, [page]);

  return (
    <div data-screen-label={'NAMD Conference — ' + page}>
      <TopBar />
      <SiteHeader current={page} onNav={setPage} />
      {page === 'Overview' && (<>
        <Hero onRegister={() => setPage('Register')} />
        <StatsBar />
        <AboutSection />
        <AgendaSection />
        <SpeakersSection />
        <SponsorsSection />
      </>)}
      {page === 'Agenda' && (<><AgendaSection /></>)}
      {page === 'Speakers' && (<><SpeakersSection /></>)}
      {page === 'Register' && (<><RegisterSection /></>)}
      {page === 'Sponsors' && (<><SponsorsSection /></>)}
      <SiteFooter />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
